<!doctype html><html lang="en"><meta charset="utf-8"><title>VYUHA texture byte qualification</title><style>body{font:16px system-ui;background:#121715;color:#e4ebdf;margin:2rem}button{padding:1rem}pre{white-space:pre-wrap;overflow-wrap:anywhere}canvas{width:256px;height:256px}</style><h1>Exact Canvas2D texture comparison</h1><p>Research fixture. Both terrain layouts and both production resolutions; original synchronous map versus chunked preparation. Full pixel bytes and texture configuration must agree. No training or scoring.</p><button id="run">Compare all four production keys</button><pre id="report" role="status">Not run</pre><div id="images"></div><script type="module">
import { facilityLayout } from '/src/world/layout.ts';
import { createSplatTexture } from '/src/world/procedural-textures.ts';
import { prepareSplat } from '/src/world/splat-kernel.ts';
import { yieldSplatTask } from '/src/world/splat-preparation.ts';
const button=document.querySelector('#run'),report=document.querySelector('#report');
const hash=async bytes=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(b=>b.toString(16).padStart(2,'0')).join('');
button.onclick=async()=>{button.disabled=true;const results=[];report.textContent='Comparing…';try{for(const terrain of ['rural_forward_base','urban_outpost'])for(const resolution of [512,1024]){const layout=facilityLayout(terrain),old=createSplatTexture(layout,resolution),data=await prepareSplat({terrain,resolution},yieldSplatTask),candidate=createSplatTexture(layout,resolution,data);const pixels=t=>t.image.getContext('2d').getImageData(0,0,resolution,resolution).data;const a=pixels(old),b=pixels(candidate);const texture=t=>JSON.stringify({wrapS:t.wrapS,wrapT:t.wrapT,mag:t.magFilter,min:t.minFilter,color:t.colorSpace,flipY:t.flipY,mip:t.generateMipmaps});results.push({terrain,resolution,original_sha256:await hash(a),candidate_sha256:await hash(b),equal:a.every((v,i)=>v===b[i]),texture_configuration_equal:texture(old)===texture(candidate)});if(resolution===1024){const title=document.createElement('h2');title.textContent=terrain;document.querySelector('#images').append(title,old.image,candidate.image)}old.dispose();candidate.dispose();report.textContent=JSON.stringify({scope:'Actual Canvas2D full raster including layout surfaces; no GPU or headset claim',results},null,2);} }catch(error){report.textContent=String(error)}finally{button.disabled=false}};
</script></html>
