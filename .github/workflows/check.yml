name: Check training build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r server/requirements.lock.txt
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: client
      # Startup/restart tests exercise production preflight, which requires dist.
      # Build in this clean checkout before running those integration tests.
      - name: Build production frontend and offline assets
        run: npm run build
        working-directory: client
      - name: Verify backend and production startup
        run: .venv/bin/python -m pytest server/tests -q
      - name: Verify frontend and Python parity
        run: npm test
        working-directory: client
      - name: Verify capability registry and evidence references
        run: .venv/bin/python scripts/check_capabilities.py
      - name: Lint frontend
        run: npm run lint
        working-directory: client
      - name: Check frontend formatting
        run: npm run format:check
        working-directory: client
      - name: Build production Docker image
        run: docker build -t vyuha:check .
